<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar Akun Dinas — ASKI PEMDA</title>
<style>
  :root { --navy-900:#B30000; --navy-800:#CC0000; --bg:#f6f7f9; --card:#fff; --border:#e2e4e8; --text:#1f2430; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:26px; width:100%; max-width:420px; }
  h1 { font-size:17px; margin:0 0 4px; color:var(--navy-900); }
  p.sub { font-size:13px; color:var(--muted); margin:0 0 18px; }
  label { display:block; font-size:13px; margin:12px 0 4px; color:var(--muted); }
  input { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
  button { width:100%; margin-top:18px; cursor:pointer; border:none; border-radius:6px; padding:10px 16px; font-size:14px; font-weight:600; background:var(--navy-900); color:#fff; }
  button:hover { background:var(--navy-800); }
  .msg { font-size:13px; margin-top:10px; }
  .msg.err { color:#b91c1c; }
  .msg.ok { color:#15803d; }
</style>
</head>
<body>
<div class="card">
  <h1>Daftar Akun Dinas</h1>
  <p class="sub">Gunakan kode undangan yang diberikan oleh admin ASKI PEMDA.</p>

  <label>Kode Undangan</label>
  <input id="code" placeholder="mis. K7Q3W9ZP" />
  <label>Nama Lengkap</label>
  <input id="nama" placeholder="Nama penanggung jawab" />
  <label>Email</label>
  <input id="email" type="email" />
  <label>Kata Sandi</label>
  <input id="password" type="password" />

  <button onclick="register()">Daftar</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aszvkvfmqpgakycfesxh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzenZrdmZtcXBnYWt5Y2Zlc3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NDcxNDQsImV4cCI6MjEwMTIyMzE0NH0.xwfXaoh_jrgKzqA3zXkQEHB141AkWBel0sjhEe6bMJk";
let sb = null;
if (window.supabase && SUPABASE_URL.indexOf("YOUR-PROJECT") === -1) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

async function register() {
  const msg = document.getElementById("msg");
  msg.textContent = "";
  if (!sb) { msg.innerHTML = '<span class="err">Supabase belum dikonfigurasi.</span>'; return; }

  const code = document.getElementById("code").value.trim().toUpperCase();
  const nama = document.getElementById("nama").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!code || !nama || !email || !password) {
    msg.innerHTML = '<span class="err">Semua kolom wajib diisi.</span>'; return;
  }

  const { data: signUpData, error: signUpError } = await sb.auth.signUp({ email, password });
  if (signUpError) { msg.innerHTML = `<span class="err">${signUpError.message}</span>`; return; }

  // Jika konfirmasi email aktif di project Supabase, sesi belum tersedia
  // sampai email dikonfirmasi — redeem_invite baru bisa dipanggil setelah login.
  if (!signUpData.session) {
    msg.innerHTML = '<span class="ok">Pendaftaran berhasil. Silakan cek email untuk konfirmasi, lalu login untuk menyelesaikan pendaftaran (masukkan kode undangan kembali di halaman ini setelah login).</span>';
    return;
  }

  const { error: redeemError } = await sb.rpc("redeem_invite", { p_code: code, p_nama: nama });
  if (redeemError) { msg.innerHTML = `<span class="err">${redeemError.message}</span>`; return; }

  msg.innerHTML = '<span class="ok">Pendaftaran berhasil! Akun Anda sudah terhubung ke dinas terkait.</span>';
}
</script>
</body>
</html>
