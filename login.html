<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASKI — Audit Sistem Kearsipan Internal</title>
<meta name="description" content="Formulir digital Audit Sistem Kearsipan Internal (ASKI) Pemerintah Daerah" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="https://iili.io/CUHJTUF.png" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" rel="stylesheet" />
<style>
:root {
  --navy-900: #4a3b52;
  --navy-800: #5c4a66;
  --navy-700: #6e5a7a;
  --blue-600: #b5678a;
  --blue-500: #c97b9c;
  --blue-400: #dd9cb6;
  --blue-100: #f7e9ef;
  --blue-50: #fbf3f6;
  --gold: #d4a94f;
  --gold-light: #e8c878;
  --teal: #4fb3ab;
  --teal-light: #7fd6cd;
  --green: #4a9a6d;
  --green-100: #e7f5ec;
  --red: #c1566a;
  --red-100: #fbe9ed;
  --gray-900: #3c3245;
  --gray-600: #7d7286;
  --gray-300: #ded3e0;
  --gray-100: #f3edf3;
  --white: #ffffff;
  --lav-page: #d9c9dd;
  --lav-shell: #f2ece7;
  --lav-sidebar: #ece3e0;
  --radius: 20px;
  --radius-sm: 12px;
  --font-display: "Poppins", "Segoe UI", sans-serif;
  --font-body: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(90,60,90,0.05), 0 8px 24px -12px rgba(90,60,90,0.16);
  --shadow-lg: 0 24px 60px -24px rgba(70,40,70,0.35);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--gray-900);
  line-height: 1.5;
  min-height: 100vh;
  background:
    radial-gradient(1200px 650px at 6% -10%, rgba(201,123,156,0.14), transparent 60%),
    radial-gradient(900px 520px at 102% -6%, rgba(79,179,171,0.12), transparent 55%),
    radial-gradient(800px 500px at 90% 100%, rgba(212,169,79,0.10), transparent 55%),
    linear-gradient(180deg, #ddd0e1 0%, #d3c2d8 100%);
  background-attachment: fixed;
  background-size: 140% 140%, 140% 140%, 140% 140%, 100% 100%;
  animation: bgDrift 24s ease-in-out infinite alternate;
  padding: 2rem;
}

@keyframes bgDrift {
  0%   { background-position: 0% 0%, 100% 0%, 100% 100%, 0 0; }
  100% { background-position: 6% 4%, 92% 6%, 94% 92%, 0 0; }
}

@keyframes stepFadeIn {
  from { opacity: 0; transform: translateY(16px) scale(0.995); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes stepSlideNext {
  from { opacity: 0; transform: translateX(28px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes stepSlidePrev {
  from { opacity: 0; transform: translateX(-28px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(220%); }
}

.boot-loading {
  padding: 4rem; text-align: center; color: var(--gray-600); font-size: 1.1rem;
}

/* ---------- LAYOUT ---------- */
.layout {
  display: flex;
  min-height: calc(100vh - 4rem);
  max-width: 1500px;
  margin: 0 auto;
  background: var(--lav-shell);
  border-radius: 32px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.sidebar {
  width: 300px;
  flex-shrink: 0;
  background:
    radial-gradient(650px 320px at 100% 0%, rgba(212,169,79,0.14), transparent 60%),
    radial-gradient(500px 260px at 0% 100%, rgba(79,179,171,0.14), transparent 60%),
    var(--lav-sidebar);
  color: var(--gray-900);
  padding: 1.5rem 1.25rem 2rem;
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: calc(100vh - 4rem);
  overflow-y: auto;
  border-right: 1px solid rgba(60,50,69,0.08);
}

.brand { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1.1rem; border-bottom: 1px solid rgba(60,50,69,0.12); }
.brand-emblem {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--white);
  object-fit: cover; object-position: center 38%;
  flex-shrink: 0; box-shadow: 0 0 0 3px rgba(212,169,79,0.35), 0 4px 14px -4px rgba(60,50,69,0.25);
}
.brand-emblem.lg { width: 56px; height: 56px; }
.brand-title { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; letter-spacing: 0.03em; background: linear-gradient(90deg, var(--navy-900), var(--blue-600)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { font-size: 0.75rem; opacity: 0.65; color: var(--gray-600); }

.unit-switch {
  display: flex; gap: 0.4rem; margin-bottom: 1.25rem;
  background: rgba(60,50,69,0.06); padding: 4px; border-radius: 11px;
}
.unit-switch button {
  flex: 1; border: none; background: transparent; color: var(--gray-600);
  font-family: var(--font-display); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.02em;
  padding: 0.55rem 0.4rem; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.18s var(--ease), color 0.18s var(--ease);
}
.unit-switch button i { font-size: 1rem; }
.unit-icon-3d { width: 20px; height: 20px; object-fit: contain; vertical-align: -5px; margin-right: 2px; filter: drop-shadow(0 2px 3px rgba(60,50,69,0.2)); }
.unit-switch button:hover { background: rgba(60,50,69,0.08); color: var(--gray-900); }
.unit-switch button.active {
  background: var(--white);
  color: var(--navy-900); box-shadow: 0 4px 14px -4px rgba(60,50,69,0.3);
}
.unit-switch-note { font-size: 0.68rem; opacity: 0.65; color: var(--gray-600); margin: -0.9rem 0 1.25rem; }

.progress-box {
  display: flex; flex-direction: column; align-items: center; gap: 0.65rem; margin-bottom: 1.5rem;
  background: linear-gradient(160deg, var(--navy-900), var(--navy-800));
  border-radius: var(--radius); padding: 1.25rem 1rem; box-shadow: var(--shadow-lg);
}
.progress-circle { position: relative; width: 116px; height: 116px; }
.progress-circle-plate {
  position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.06);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.15);
}
.progress-circle svg { position: relative; width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.progress-circle-bg { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 12; }
.progress-circle-fill {
  fill: none; stroke: var(--blue-500); stroke-width: 12; stroke-linecap: round;
  transition: stroke-dashoffset 0.5s var(--ease);
  filter: drop-shadow(0 4px 5px rgba(201,123,156,0.45));
}
.progress-circle-inner {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,0.1);
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
}
.progress-circle-label {
  font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em;
  color: var(--white);
}
.progress-circle-caption { font-size: 0.72rem; opacity: 0.85; text-align: center; color: rgba(255,255,255,0.85); }

.nav-group-title {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
  opacity: 0.55; color: var(--gray-600); margin: 1rem 0 0.4rem 0.25rem;
}

.step-list { list-style: none; margin: 0; padding: 0; }
.step-list li {
  padding: 0.55rem 0.65rem; margin-bottom: 3px; border-radius: 9px;
  font-size: 0.85rem; cursor: pointer; opacity: 0.85; position: relative;
  display: flex; align-items: center; gap: 9px;
  transition: background 0.18s var(--ease), transform 0.18s var(--ease), opacity 0.18s;
}
.step-list li i.step-icon { font-size: 1.05rem; flex-shrink: 0; color: var(--blue-600); }
.step-list li .done-icon { font-size: 1.05rem; flex-shrink: 0; color: var(--teal); }
.step-list li.active .done-icon { color: var(--green); }
.step-icon-3d { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(60,50,69,0.2)); }
.done-icon-3d { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
.step-list li:hover { background: rgba(60,50,69,0.06); transform: translateX(3px); }
.step-list li.locked { opacity: 0.45; }
.step-list li.locked:hover { background: transparent; transform: none; }
.step-list li.active {
  background: var(--white);
  color: var(--navy-900); font-weight: 600; opacity: 1;
  box-shadow: 0 4px 16px -3px rgba(60,50,69,0.18);
  border-radius: 999px 0 0 999px;
  margin-right: -1.25rem;
  padding-right: 1.5rem;
}

.content { flex: 1; padding: 2.5rem 3rem 3rem; max-width: 980px; }
.main-topbar {
  display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.75rem;
}
.main-topbar-progress { flex: 1; max-width: 460px; }
.main-topbar-progress-label {
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem;
  font-size: 0.82rem; color: var(--gray-600); margin-bottom: 0.4rem;
}
.main-topbar-progress-label b {
  font-family: var(--font-display); font-size: 1rem; color: var(--navy-900);
}
.main-topbar-progress-track {
  height: 12px; border-radius: 999px; background: rgba(60,50,69,0.1);
  overflow: hidden; box-shadow: inset 0 1px 2px rgba(60,50,69,0.08);
}
.main-topbar-progress-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--blue-500), var(--teal));
  box-shadow: 0 0 8px rgba(201,123,156,0.5);
  transition: width 0.5s var(--ease);
}
@media (max-width: 700px) {
  .main-topbar { flex-wrap: wrap; }
  .main-topbar-progress { order: 1; max-width: 100%; width: 100%; }
}
.content-inner { margin-bottom: 2rem; }
.content-inner.trans-same { animation: stepFadeIn 0.5s var(--ease) both; }
.content-inner.trans-next { animation: stepSlideNext 0.45s var(--ease) both; }
.content-inner.trans-prev { animation: stepSlidePrev 0.45s var(--ease) both; }

h1 { font-family: var(--font-display); font-size: 1.6rem; color: var(--navy-900); margin: 0 0 0.35rem; letter-spacing: 0.01em; }
h3 { font-family: var(--font-display); color: var(--navy-800); font-size: 1.05rem; margin: 0 0 0.9rem; }
.group-section-heading {
  font-family: var(--font-display);
  font-size: 1.15rem; font-weight: 700; color: var(--navy-900);
  margin: 1.75rem 0 0.6rem; padding-bottom: 0.4rem; position: relative;
  border-bottom: 2px solid var(--gray-100);
}
.group-section-heading::after {
  content: ""; position: absolute; left: 0; bottom: -2px; height: 2px; width: 64px;
  background: linear-gradient(90deg, var(--gold), var(--teal));
}
.group-section-heading:first-child { margin-top: 0; }
.lead { color: var(--gray-600); margin: 0 0 1.5rem; font-size: 0.95rem; }

.card {
  background: var(--white); border: 1px solid rgba(214,222,230,0.7);
  border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
  transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; transform: scaleX(0);
  transform-origin: left; background: linear-gradient(90deg, var(--blue-500), var(--teal), var(--gold));
  transition: transform 0.3s var(--ease);
}
.card:hover { box-shadow: 0 6px 10px rgba(90,60,90,0.06), 0 18px 36px -16px rgba(90,60,90,0.24); transform: translateY(-2px); }
.card:hover::before { transform: scaleX(1); }
.warning-card { border-left: 4px solid var(--gold); background: linear-gradient(180deg,#fffaf0,#fff); }
.success-card { border-left: 4px solid var(--green); background: linear-gradient(180deg,#f2fbf5,#fff); }

.cond-box {
  background: linear-gradient(180deg, #fffbe0, #fff8cc);
  border: 1px solid #ecd94a; border-left: 4px solid var(--gold);
  transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.cond-box-row { display: flex; align-items: flex-start; gap: 1rem; }
.cond-box-text { flex: 1; font-style: italic; font-size: 0.92rem; line-height: 1.5; color: var(--gray-900); }

.cond-box-checkbox {
  -webkit-appearance: none; appearance: none;
  flex-shrink: 0; width: 26px; height: 26px; margin-top: 2px;
  border-radius: 8px; border: 2px solid #d8c34a; background: var(--white);
  cursor: pointer; position: relative;
  transition: all 0.18s var(--ease);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}
.cond-box-checkbox:hover { border-color: var(--gold); }
.cond-box-checkbox:checked {
  background: linear-gradient(150deg, var(--gold-light), var(--gold));
  border-color: var(--gold);
}
.cond-box-checkbox:checked::after {
  content: "";
  position: absolute; left: 8px; top: 3px;
  width: 6px; height: 12px;
  border: solid var(--navy-900);
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.cond-box.checked { background: linear-gradient(180deg, #fff3b0, #ffed80); box-shadow: 0 4px 16px -8px rgba(201,162,39,0.5); }
.q-locked { opacity: 0.45; }
.q-locked .radio-pill { cursor: not-allowed; }
.q-locked .check-pill { cursor: not-allowed; }
.q-locked input[type="number"],
.q-locked input[type="checkbox"] { cursor: not-allowed; }
.q-sublock-note { font-size: 0.72rem; color: var(--gray-600); font-style: italic; }

.form-header { margin-bottom: 1.5rem; }
.badge {
  display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
  padding: 0.25rem 0.65rem; border-radius: 99px; margin-bottom: 0.6rem; text-transform: uppercase;
}
.badge-up { background: var(--blue-100); color: var(--blue-600); }
.badge-uk { background: #fdf1de; color: #a3690a; }

/* ---------- FORM FIELDS ---------- */
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--gray-900); margin-bottom: 0.3rem; }
.field input {
  width: 100%; padding: 0.6rem 0.75rem; border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-sm); font-size: 0.92rem; background: var(--white);
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.field input:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 3px var(--blue-100); }
.field textarea {
  width: 100%; padding: 0.6rem 0.75rem; border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-sm); font-size: 0.92rem; background: var(--white);
  font-family: inherit; resize: vertical;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.field textarea:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 3px var(--blue-100); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.25rem; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 1.25rem; }

/* ---------- SIGN BLOCK (footer setiap formulir sub aspek) ---------- */
.sign-block {
  display: grid; grid-template-columns: 1fr 1fr;
  border: 1.5px solid var(--gray-900); border-radius: var(--radius-sm);
  overflow: hidden; margin-top: 1.5rem; background: var(--white);
}
.sign-col { padding: 1.1rem 1.4rem; }
.sign-col:first-child { border-right: 1.5px solid var(--gray-900); }
.sign-subtitle { font-weight: 700; font-size: 0.92rem; color: var(--gray-900); margin: 0 0 0.6rem; }
.sign-row { display: flex; gap: 0.5rem; font-size: 0.92rem; margin-bottom: 0.6rem; }
.sign-row:last-child { margin-bottom: 0; }
.sign-label { min-width: 6.5rem; color: var(--gray-900); }
.sign-colon { color: var(--gray-600); }
.sign-value { color: var(--gray-900); font-weight: 500; }
.sign-value.empty { color: var(--gray-600); font-weight: 400; font-style: italic; }
.sign-list { list-style: none; margin: 0; padding: 0; }
.sign-list li { display: flex; gap: 0.5rem; font-size: 0.92rem; margin-bottom: 0.6rem; }
.sign-list li:last-child { margin-bottom: 0; }
.sign-list li::before { content: attr(data-num) "."; min-width: 1.1rem; color: var(--gray-900); }
.sign-hint { font-size: 0.78rem; color: var(--gray-600); font-style: italic; margin: 0.5rem 0 0; }

/* ---------- QUESTION TABLE ---------- */
.q-table { width: 100%; border-collapse: collapse; }
.q-table tr { border-bottom: 1px solid var(--gray-100); }
.q-table tr:last-child { border-bottom: none; }
.q-label { padding: 0.75rem 1rem 0.75rem 0; font-size: 0.9rem; width: 70%; vertical-align: top; }
.q-note { font-size: 0.78rem; color: var(--gray-600); font-style: italic; margin-top: 0.25rem; }
.q-subheading-row { border-bottom: none !important; }
.q-subheading-row td { padding: 1rem 0 0.4rem; }
.q-subheading-row:first-child td { padding-top: 0; }
.q-subheading {
  font-weight: 700; font-size: 0.88rem; color: var(--navy-800);
  text-transform: uppercase; letter-spacing: 0.02em;
  padding-bottom: 0.35rem; border-bottom: 1px solid var(--gray-200);
}
.q-input { padding: 0.75rem 0; white-space: normal; vertical-align: top; }

.radio-pill {
  display: inline-flex; align-items: center; gap: 0.45rem;
  border: 1.5px solid var(--gray-300); border-radius: 99px; padding: 0.4rem 0.95rem 0.4rem 0.7rem;
  margin-right: 0.5rem; font-size: 0.85rem; font-weight: 500; cursor: pointer;
  background: var(--white); color: var(--gray-600);
  transition: all 0.18s var(--ease);
  position: relative;
}
.radio-pill:hover { border-color: var(--blue-400); transform: translateY(-1px); box-shadow: 0 4px 10px -6px rgba(90,60,90,0.25); }
/* sembunyikan radio asli, gantikan dengan indikator kustom */
.radio-pill input[type="radio"] {
  -webkit-appearance: none; appearance: none; margin: 0;
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--gray-300); flex-shrink: 0;
  position: relative; cursor: pointer;
  transition: border-color 0.18s var(--ease);
}
.radio-pill input[type="radio"]::after {
  content: ""; position: absolute; inset: 3px; border-radius: 50%;
  background: currentColor; transform: scale(0); transition: transform 0.16s var(--ease);
}
.radio-pill input[type="radio"]:checked::after { transform: scale(1); }
.radio-pill input[type="radio"]:disabled { cursor: not-allowed; opacity: 0.5; }

.radio-pill.sel-ya {
  background: var(--green-100); border-color: var(--green); color: var(--green); font-weight: 700;
  box-shadow: 0 3px 10px -6px rgba(26,127,55,0.4);
}
.radio-pill.sel-ya input[type="radio"] { border-color: var(--green); color: var(--green); }
.radio-pill.sel-tidak {
  background: var(--red-100); border-color: var(--red); color: var(--red); font-weight: 700;
  box-shadow: 0 3px 10px -6px rgba(185,28,28,0.35);
}
.radio-pill.sel-tidak input[type="radio"] { border-color: var(--red); color: var(--red); }

/* Nilai Standar & Skor — Tidak = otomatis 0; Ya = default Nilai Standar,
   tapi angkanya bisa diisi/diubah manual oleh auditor (lihat .skor-manual-input) */
.qs-meta { display: inline-flex; gap: 0.4rem; margin-left: 0.25rem; vertical-align: middle; }
.qs-badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 0.72rem; font-weight: 600;
  background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-300);
}
.qs-badge b { font-size: 0.85rem; font-weight: 800; }
.qs-badge.qs-std { color: var(--blue-600); border-color: var(--blue-100); background: var(--blue-50); }
.qs-badge.qs-skor-ya { color: var(--green); border-color: var(--green); background: var(--green-100); }
.qs-badge.qs-skor-tidak { color: var(--red); border-color: var(--red); background: var(--red-100); }
.skor-manual-input {
  width: 76px; padding: 0.3rem 0.5rem; border: 1.5px solid currentColor;
  border-radius: 6px; font-size: 1rem; font-weight: 800; background: var(--white);
  color: inherit; text-align: center;
}
.skor-manual-input:focus { outline: none; box-shadow: 0 0 0 2px var(--blue-100); }

.na-toggle {
  display: flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem;
  font-size: 0.75rem; color: var(--gray-600); cursor: pointer; white-space: normal;
}
.na-toggle input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }

.percent-input {
  width: 84px; padding: 0.5rem 0.65rem; border: 1.5px solid var(--gray-300);
  border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--white);
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}

// nilaiStandar = "Nilai Standar" (bobot maksimal butir ini, sesuai kolom
// "NILAI STD" pada instrumen ASKI — default 100). Skor otomatis dihitung:
// dijawab "Ya" -> Skor = Nilai Standar; dijawab "Tidak" -> Skor = 0.
function Y(id, label, note, nilaiStandar) {
  return { id, label, type: "yn", note: note || null, nilaiStandar: nilaiStandar || 100 };
}
// Helper untuk pertanyaan berbasis persentase (0-100)
function P(id, label, note) {
  return { id, label, type: "percent", note: note || null };
}
// Helper untuk pertanyaan pilihan (tidak dihitung skor, informasi saja)
function INFO(id, label, options) {
  return { id, label, type: "info", options };
}
// Helper untuk pernyataan checklist/centang (rincian pendukung sebuah poin utama;
// tidak dihitung dalam skor Ya/Tidak, tapi dicatat sebagai bukti kondisi faktual)
function CHK(id, label, options, note) {
  return { id, label, type: "checklist", options, note: note || null };
}
// Helper untuk pernyataan yang diisi dengan angka (mis. jumlah sampel, jumlah
// arsiparis/pengelola arsip dalam satuan "Orang", jumlah Unit Pengolah, dsb.
// Bersifat data pendukung/informasi kuantitatif, tidak dihitung dalam skor Ya/Tidak.
function N(id, label, unit, note, max) {
  return { id, label, type: "number", unit: unit || null, note: note || null, max: max || null };
}
// Helper untuk menandai sebuah pertanyaan "dapat dihilangkan" jika pertanyaan
// lain (qid) dijawab "Ya" — mis. 1.5.2 dapat dihilangkan jika 1.5.1 dijawab
// "Ya". Membungkus question object hasil Y()/N()/dst tanpa mengubah builder-nya.
function SKIPIF(question, qid) {
  return { ...question, skipIfYesId: qid };
}
// Helper untuk menandai pertanyaan Ya/Tidak yang menurut instrumen ASKI dapat
// "tidak menjadi pembagi" — yaitu Kotak Nilai Standar butir tersebut boleh
// dinolkan secara manual oleh auditor ketika kondisinya memang tidak berlaku
// pada Unit Pengolah/Unit Kearsipan yang diaudit (lihat catatan pada masing-
// masing butir). Menandai butir ini menampilkan opsi centang "Tidak menjadi
// pembagi (Nilai Standar dinolkan)"; jika dicentang, Nilai Standar & Skor
// butir menjadi 0 dan butir tersebut dikeluarkan dari rata-rata skor formulir.
function NA(question) {
  return { ...question, canBeNA: true };

// otomatis mengikuti (di-link) skor pertanyaan Ya/Tidak lain di formulir lain

// sebagai info baca-saja; jika pertanyaan sumbernya dinolkan (NA), butir ini
// otomatis ikut dinolkan juga.
function LINKQ(id, label, note, sourceQid) {
  return { id, label, type: "yn", note: note || null, nilaiStandar: 100, linkQid: sourceQid };
}
// Helper untuk pertanyaan yang skornya otomatis mengikuti PERSENTASE skor
// keseluruhan formulir lain, diskalakan ke 0-100 (mis. butir 1.7.1 SDM

function LINKFORM(id, label, note, sourceFormId) {

}

// (belum dipilih). options: [{ value, label, skor }, ...]

function ZEROIF(question, boxId) {

            { value: "terintegrasi", label: "Aplikasi terintegrasi", skor: 100 },
            { value: "tidak_terintegrasi", label: "Aplikasi tidak terintegrasi", skor: 50 },
          ]), "b22_arsip_elektronik"),

          ONLYIF(Y("b22_7", "7. Koneksi internet yang disediakan oleh lingkungan kantor"), "b22_arsip_elektronik"),
          ONLYIF(Y("b22_8", "8. Server (termasuk penggunaan cloud server)"), "b22_arsip_elektronik"),

  },
];

// Peta id pertanyaan -> objek pertanyaan, dipakai untuk pertanyaan yang
// skornya mengikuti (link) pertanyaan/formulir lain (lihat LINKQ/LINKFORM).
const QUESTIONS_BY_ID = {};
ASKI_FORMS.forEach((form) => form.groups.forEach((g) => g.questions.forEach((q) => {
  if (q.id) QUESTIONS_BY_ID[q.id] = q;
})));

// Kategori & pemetaan nilai akhir sesuai tabel rekapitulasi resmi
function getKategori(nilai) {
  if (nilai > 90) return { kode: "AA", label: "Sangat Memuaskan", color: "#0d6b34" };
  if (nilai > 80) return { kode: "A", label: "Memuaskan", color: "#1a7f37" };
  if (nilai > 70) return { kode: "BB", label: "Sangat Baik", color: "#2563a8" };
  if (nilai > 60) return { kode: "B", label: "Baik", color: "#2563a8" };
  if (nilai > 50) return { kode: "CC", label: "Cukup", color: "#b8860b" };
  if (nilai > 30) return { kode: "C", label: "Kurang", color: "#c2410c" };
  return { kode: "D", label: "Sangat Kurang", color: "#b91c1c" };
}

</script>
<script>
/* ============================================================
   APLIKASI AUDIT SISTEM KEARSIPAN INTERNAL (ASKI) PEMDA
   Alur: Isi Data Instansi -> Isi 12 Formulir (UP & UK) -> Tinjau
         -> Kirim -> Lihat Hasil Rekapitulasi
   ============================================================ */

// Setiap unit (Unit Pengolah / Unit Kearsipan) punya draft localStorage
// sendiri, terpisah sepenuhnya, supaya kedua unit bisa mengisi formulir
// masing-masing tanpa saling menimpa/mempengaruhi data satu sama lain,
// walaupun dibuka dari file HTML dan browser yang sama.
const DRAFT_KEYS = { UP: "aski_draft_up_v1", UK: "aski_draft_uk_v1" };
const ACTIVE_UNIT_KEY = "aski_active_unit_v1";
let activeUnit = (localStorage.getItem(ACTIVE_UNIT_KEY) === "UK") ? "UK" : "UP";

function getSteps(unit) {
  const forms = ASKI_FORMS.filter((f) => f.unit === unit);
  const dataStep = unit === "UP" ? "data_up" : "data_uk";
  return ["info", dataStep, ...forms.map((f) => f.id), "review"];
}

function emptyState() {
  return {
    step: 0,
    info: {
      namaInstansi: "",
      unitPengolah: "",
      unitKearsipan: "",
      alamat: "",
      tanggalAudit: "",
      tim1: "", tim2: "", tim3: "",
      upNama: "", upJabatan: "",
      ukNama: "", ukJabatan: "",
      // Data Umum Unit Pengolah
      duUpNamaUnit: "", duUpAlamat: "", duUpNamaPJ: "", duUpJmlArsiparis: "", duUpJmlPengelola: "",
      duUpVolumeAktif: "", duUpJmlDaftarAktif: "", duUpNarahubungNama: "", duUpNarahubungHp: "",
      duUpArsipVital: "", duUpArsipTerjaga: "",
      // Data Umum Unit Kearsipan
      duUkNamaUnit: "", duUkAlamat: "", duUkNamaPJ: "", duUkJmlArsiparis: "", duUkJmlPengelola: "",
      duUkVolumeInaktif: "", duUkJmlDaftarInaktif: "", duUkNarahubungNama: "", duUkNarahubungHp: "",
    },
    answers: {},
    submitted: false,
    result: null,
    recordId: null,
  };
}

let state = emptyState();

function loadDraft() {
  state = emptyState();
  try {
    const raw = localStorage.getItem(DRAFT_KEYS[activeUnit]);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  } catch (e) { console.warn("Gagal memuat draft", e); }
}

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEYS[activeUnit], JSON.stringify(state)); }
  catch (e) { console.warn("Gagal menyimpan draft", e); }
}

// Berpindah antara ruang kerja Unit Pengolah dan Unit Kearsipan. Draft unit
// yang sedang aktif disimpan dulu, lalu draft unit tujuan dimuat — kedua
// draft sama sekali tidak saling bersentuhan.
function switchUnit(unit) {
  if (unit === activeUnit) return;
  saveDraft();
  activeUnit = unit;
  try { localStorage.setItem(ACTIVE_UNIT_KEY, activeUnit); } catch (e) {}
  loadDraft();
  __lastStepIndex = state.step;
  render();
}

function resetAll() {
  const unitLabel = activeUnit === "UP" ? "Unit Pengolah" : "Unit Kearsipan";
  if (!confirm(`Mulai audit baru untuk ${unitLabel}? Seluruh data isian ${unitLabel} saat ini akan dihapus. (Data unit lainnya tidak terpengaruh.)`)) return;
  localStorage.removeItem(DRAFT_KEYS[activeUnit]);
  state = emptyState();
  render();
}

function isSkipped(q) {
  return !!q.skipIfYesId && state.answers[q.skipIfYesId] === "ya";
}

// "Nilai Standar" (bobot maksimal) sebuah pertanyaan Ya/Tidak, sesuai kolom
// "NILAI STD" pada instrumen ASKI. Untuk butir yang ditandai NA() dan telah
// dicentang "Tidak menjadi pembagi", Nilai Standar dinolkan secara manual —
// artinya butir tersebut tidak lagi dihitung sebagai pembagi dalam skor.
function getNilaiStandar(q) {
  if (q.type !== "yn" && q.type !== "choice") return null;
  // Butir LINKQ ikut dinolkan otomatis jika pertanyaan sumbernya (di formulir
  // lain) sedang dinolkan (NA) — karena keduanya menilai fakta yang sama.
  if (q.linkQid) {
    const src = QUESTIONS_BY_ID[q.linkQid];
    if (src && !getNilaiStandar(src)) return 0;
  }
  if (q.zeroedByBoxId && state.answers[q.zeroedByBoxId]) return 0;
  if (q.requiresBoxId && !state.answers[q.requiresBoxId]) return 0;
  if (q.canBeNA && state.answers[q.id + "_na"]) return 0;
  return q.nilaiStandar || 100;
}
// Menghitung skor total (skala 0-100) satu formulir dari jawaban yang sudah
// ada, dipakai oleh LINKFORM (mis. 1.7.1 SDM mengikuti % skor formulir
// Penciptaan Arsip). Terpisah dari computeScores() supaya tidak terjadi
// rekursi tak terhingga ketika formulir tujuan (mis. A.2.1) juga memiliki
// butir LINKFORM/LINKQ.
function formScorePercent(formId) {
  const form = ASKI_FORMS.find((f) => f.id === formId);
  if (!form) return 0;
  let sum = 0, stdTotal = 0;
  form.groups.forEach((g) => g.questions.forEach((q) => {
    if ((q.type !== "yn" && q.type !== "choice") || isSkipped(q)) return;
    const std = getNilaiStandar(q);
    if (!std) return;
    stdTotal += std;
    if (q.type === "choice") { sum += getSkor(q) || 0; return; }
    if (state.answers[q.id] === "ya") sum += getSkor(q);
  }));
  return stdTotal ? (sum / stdTotal) * 100 : 0;
}
// Skor sebuah pertanyaan Ya/Tidak: "Tidak" -> Skor otomatis = 0 (tidak bisa
// diubah). "Ya" -> Skor pada dasarnya = Nilai Standar, TAPI angkanya dapat
// diisi/diubah manual oleh auditor (disimpan di state.answers[q.id+"_skor"]),
// mis. untuk kasus penilaian sebagian/parsial. Nilainya dibatasi 0..Nilai
// Standar. Mengembalikan null jika pertanyaan belum dijawab.
function getSkor(q) {
  if (q.type !== "yn" && q.type !== "choice") return null;
  const std = getNilaiStandar(q);
  if (!std) return 0;
  if (q.type === "choice") {
    const val = state.answers[q.id];
    const opt = (q.options || []).find((o) => o.value === val);
    return opt ? opt.skor : (val !== undefined && val !== "" ? 0 : null);
  }
  // Skor otomatis (auto-link) — tidak diisi manual, mengikuti sumbernya.
  if (q.linkFormId) return Math.round(formScorePercent(q.linkFormId) * 100000) / 100000;
  if (q.linkQid) {
    const src = QUESTIONS_BY_ID[q.linkQid];
    return src ? (getSkor(src) || 0) : 0;
  }
  const val = state.answers[q.id];
  if (val === "ya") {
    const manual = state.answers[q.id + "_skor"];
    if (manual !== undefined && manual !== "" && manual !== null) {
      const n = Number(manual);
      if (!isNaN(n)) return Math.max(0, Math.min(std, n));
    }
    return std; // belum diubah manual -> default awal = Nilai Standar
  }
  if (val === "tidak") return 0;
  return null;
}

/* ---------------- SCORING ---------------- */
function computeScores() {
  const formScores = {};
  ASKI_FORMS.filter((f) => f.unit === activeUnit).forEach((form) => {
    let sum = 0, stdTotal = 0, count = 0, answered = 0;
    form.groups.forEach((g) => g.questions.forEach((q) => {
      if (q.type === "info" || q.type === "checklist" || q.type === "number" || q.type === "subheading" || isSkipped(q)) return;
      if (q.type === "yn" || q.type === "choice") {
        const std = getNilaiStandar(q);
        // Nilai Standar dinolkan secara manual (NA) -> butir dikeluarkan
        // sepenuhnya, tidak menjadi pembagi sama sekali.
        if (!std) return;
        count++;
        stdTotal += std;
        if (q.linkFormId || q.linkQid) {
          // Butir auto-link selalu dianggap "terisi" — nilainya diturunkan
          // otomatis dari formulir/pertanyaan lain, bukan dijawab manual.
          answered++;
          sum += getSkor(q);
          return;
        }
        const val = state.answers[q.id];
        if (val !== undefined && val !== "") {
          answered++;
          sum += q.type === "choice" ? (getSkor(q) || 0) : (val === "ya" ? getSkor(q) : 0);
        }
      } else if (q.type === "percent") {
        count++;
        stdTotal += 100;
        const val = state.answers[q.id];
        if (val !== undefined && val !== "") {
          answered++;
          sum += Math.max(0, Math.min(100, Number(val) || 0));
        }
      }
    }));
    formScores[form.id] = {
      score: stdTotal ? (sum / stdTotal) * 100 : 0,
      sum, stdTotal, count, answered,
      title: form.title, code: form.code, unit: form.unit, aspect: form.aspect, maxPoin: form.maxPoin,
    };
  });

  function aspectScore(aspect) {
    const forms = ASKI_FORMS.filter((f) => f.unit === activeUnit && f.aspect === aspect);
    const total = forms.reduce((s, f) => s + formScores[f.id].score, 0);
    return forms.length ? total / forms.length : 0;
  }

  const result = { forms: formScores, unit: activeUnit };
  const dinamis = aspectScore("dinamis");
  const sdk = aspectScore("sdk");
  const overall = dinamis * 0.5 + sdk * 0.5;
  result[activeUnit.toLowerCase()] = { dinamis, sdk, overall, kategori: getKategori(overall) };
  return result;
}

// Menentukan apakah satu langkah/aspek sudah lengkap diisi. Dipakai untuk
// mengunci navigasi berurutan: pengguna tidak bisa lompat ke aspek
// berikutnya sebelum aspek yang sedang terbuka selesai diisi.
function isStepComplete(stepId) {
  const i = state.info;
  if (stepId === "info") {
    const unitVal = activeUnit === "UP" ? i.unitPengolah : i.unitKearsipan;
    return !!(i.namaInstansi && i.tanggalAudit && unitVal && i.alamat);
  }
  if (stepId === "data_up") {
    return !!(i.duUpNamaUnit && i.duUpAlamat && i.duUpNamaPJ && i.duUpJmlArsiparis &&
      i.duUpJmlPengelola && i.duUpVolumeAktif && i.duUpJmlDaftarAktif &&
      i.duUpNarahubungNama && i.duUpNarahubungHp);
  }
  if (stepId === "data_uk") {
    return !!(i.duUkNamaUnit && i.duUkAlamat && i.duUkNamaPJ && i.duUkJmlArsiparis &&
      i.duUkJmlPengelola && i.duUkVolumeInaktif && i.duUkJmlDaftarInaktif &&
      i.duUkNarahubungNama && i.duUkNarahubungHp);
  }
  if (stepId === "review") return true;
  const form = ASKI_FORMS.find((f) => f.id === stepId);
  if (!form) return true;
  let complete = true;
  form.groups.forEach((g) => g.questions.forEach((q) => {
    if (q.type === "info" || q.type === "checklist" || q.type === "number" || q.type === "subheading" || isSkipped(q)) return;
    if (q.linkFormId || q.linkQid) return;
    const v = state.answers[q.id];
    if (v === undefined || v === "") complete = false;
  }));
  return complete;
}

// Indeks langkah terjauh yang boleh diakses: langkah pertama yang belum
// lengkap adalah batasnya (masih boleh dibuka untuk dilengkapi), tapi
// langkah setelahnya terkunci sampai langkah tersebut selesai.
function maxReachableStepIndex() {
  const steps = getSteps(activeUnit);
  for (let idx = 0; idx < steps.length; idx++) {
    if (!isStepComplete(steps[idx])) return idx;
  }
  return steps.length - 1;
}

function totalProgress() {
  let total = 0, answered = 0;
  ASKI_FORMS.filter((f) => f.unit === activeUnit).forEach((form) => form.groups.forEach((g) => g.questions.forEach((q) => {
    if (q.type === "info" || q.type === "checklist" || q.type === "number" || q.type === "subheading" || isSkipped(q)) return;
    total++;
    if (q.linkFormId || q.linkQid) { answered++; return; } // auto-link -> selalu terisi
    const v = state.answers[q.id];
    if (v !== undefined && v !== "") answered++;
  })));
  return { total, answered, pct: total ? Math.round((answered / total) * 100) : 0 };
}

/* ---------------- RENDER: SHELL ---------------- */
const app = document.getElementById("app");
let __lastStepIndex = 0;
let __lastWasSameStep = true;

function render(keepScroll) {
  const prevScrollY = keepScroll ? window.scrollY : 0;
  saveDraft();
  if (state.submitted && state.result) return renderResult();

  const steps = getSteps(activeUnit);
  const step = steps[state.step];
  const dir = keepScroll
    ? "same"
    : state.step > __lastStepIndex ? "next" : state.step < __lastStepIndex ? "prev" : "same";
  __lastStepIndex = state.step;

  const prog = totalProgress();
  app.innerHTML = `
    <div class="layout">
      ${renderSidebar(step)}
      <main class="content">
        <div class="main-topbar">
          <div class="main-topbar-progress">
            <div class="main-topbar-progress-label">
              <span>Progres Pengisian Formulir</span>
              <b>${prog.pct}%</b>
            </div>
            <div class="main-topbar-progress-track">
              <div class="main-topbar-progress-fill" style="width:${prog.pct}%"></div>
            </div>
          </div>
          ${currentProfile ? `
          <div class="user-box">
            <div class="user-box-info">
              <div class="user-box-name">${currentProfile.nama || currentSession.user.email}</div>
              <div class="user-box-dinas">${(currentProfile.dinas && currentProfile.dinas.nama) || ""}</div>
            </div>
            <button type="button" class="user-box-logout" onclick="doAuthLogout()">Keluar</button>
          </div>` : ""}
        </div>
        <div class="content-inner trans-${dir}" id="content-inner"></div>
        ${renderNav(step)}
      </main>
    </div>
  `;
  const inner = document.getElementById("content-inner");
  if (step === "info") inner.innerHTML = renderInfoForm();
  else if (step === "data_up") inner.innerHTML = renderDataUmumUP();
  else if (step === "data_uk") inner.innerHTML = renderDataUmumUK();
  else if (step === "review") inner.innerHTML = renderReview();
  else inner.innerHTML = renderQuestionForm(ASKI_FORMS.find((f) => f.id === step));

  attachHandlers(step);
  // Saat berpindah langkah, mulai dari atas. Saat hanya menjawab satu
  // pertanyaan Ya/Tidak di tengah formulir (lihat attachHandlers), posisi
  // scroll dipertahankan agar tampilan tidak melompat ke atas.
  window.scrollTo(0, keepScroll ? prevScrollY : 0);
}

function renderSidebar(currentStep) {
  const prog = totalProgress();
  const steps = getSteps(activeUnit);
  const forms = ASKI_FORMS.filter((f) => f.unit === activeUnit);
  const dataStepId = activeUnit === "UP" ? "data_up" : "data_uk";
  const dataStepLabel = activeUnit === "UP" ? "Data Umum Unit Pengolah" : "Data Umum Unit Kearsipan";
  const groupTitle = activeUnit === "UP" ? "A. Unit Pengolah" : "B. Unit Kearsipan";
  const circumference = 251.3;
  const offset = (circumference - (circumference * prog.pct) / 100).toFixed(1);
  // Ikon dari Flaticon pack "Home Screen Apps" — https://www.flaticon.com/packs/home-screen-apps-21
  function formIconFor(title) {
    if (title.startsWith("Penciptaan")) return "3845869"; // Edition
    if (title.startsWith("Penggunaan")) return "3845863"; // Search
    if (title.startsWith("Pemeliharaan")) return "3845826"; // Settings
    if (title.startsWith("Penyusutan")) return "3845738"; // Clock
    if (title.startsWith("Sumber Daya Manusia")) return "3845847"; // Contacts
    if (title.startsWith("Prasarana")) return "3845851"; // Bank
    return "3845758"; // Notes (default)
  }
  const icon3d = (id) => `https://cdn-icons-png.flaticon.com/128/3845/${id}.png`;
  const maxReachable = maxReachableStepIndex();
  function item(stepId, label, iconSlug) {
    const active = stepId === currentStep ? "active" : "";
    const idx = steps.indexOf(stepId);
    const done = isStepComplete(stepId) && stepId !== "review" ? "done" : "";
    const locked = idx > maxReachable ? "locked" : "";
    return `<li class="${active} ${done} ${locked}" data-step="${stepId}">
      <img class="step-icon-3d" src="${icon3d(iconSlug)}" alt="" aria-hidden="true" />
      <span style="flex:1">${label}</span>
      ${done ? `<img class="done-icon-3d" src="${icon3d("3845853")}" alt="" aria-hidden="true" />` : ""}
    </li>`;
  }
  return `
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-emblem" src="${LOGO_URL}" alt="Archive logo" />
        <div>
          <div class="brand-title">AUDIT SISTEM KEARSIPAN INTERNAL</div>
          <div class="brand-sub">Pemerintah Daerah Kabupaten Malaka</div>
        </div>
      </div>
      <div class="unit-switch">
        <button type="button" class="${activeUnit === "UP" ? "active" : ""}" data-unit="UP"><img class="unit-icon-3d" src="${icon3d("3845783")}" alt="" aria-hidden="true" /> Unit Pengolah</button>
        <button type="button" class="${activeUnit === "UK" ? "active" : ""}" data-unit="UK"><img class="unit-icon-3d" src="${icon3d("3845870")}" alt="" aria-hidden="true" /> Unit Kearsipan</button>
      </div>
      <div class="progress-box">
        <div class="progress-circle">
          <div class="progress-circle-plate"></div>
          <svg viewBox="0 0 100 100">
            <circle class="progress-circle-bg" cx="50" cy="50" r="40"></circle>
            <circle class="progress-circle-fill" cx="50" cy="50" r="40" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="progress-circle-inner">
            <div class="progress-circle-label">${prog.pct}%</div>
          </div>
        </div>
        <div class="progress-circle-caption">Progres ${activeUnit === "UP" ? "Unit Pengolah" : "Unit Kearsipan"}</div>
      </div>
      <nav>
        <ul class="step-list">
          ${item("info", "Data Instansi", "3845895")}
        </ul>
        <div class="nav-group-title">${groupTitle}</div>
        <ul class="step-list">
          ${item(dataStepId, dataStepLabel, "3845758")}
          ${forms.map((f) => item(f.id, f.title, formIconFor(f.title))).join("")}
        </ul>
        <ul class="step-list">
          ${item("review", "Tinjau &amp; Kirim", "3845692")}
        </ul>
      </nav>
    </aside>
  `;
}

        : `<button class="btn btn-primary" id="btn-next">Selanjutnya &rarr;</button>`}

// Pola kondisional Ya/Tidak -> sub-poin (sama seperti updateBlockState() pada
// form evaluasi naskah dinas): setiap pertanyaan Ya/Tidak adalah "induk" bagi
// sub-poin non-Ya/Tidak (jumlah sampel, persentase, checklist rincian) yang
// mengikutinya dalam grup yang sama. Saat induk dijawab "Tidak", seluruh
// sub-poin tersebut dikosongkan (setara "direset ke 0") supaya tidak
// menyimpan data usang saat sub-poin terkunci/disabled.
function clearLockedSubAnswers(form, changedQid, newVal) {
  if (!form || newVal !== "tidak") return;
  form.groups.forEach((g) => {
    let isSubOfChanged = false;
    g.questions.forEach((q) => {
      if (q.type === "yn") {
        isSubOfChanged = q.id === changedQid;
        return;
      }
      if (isSubOfChanged) delete state.answers[q.id];
    });
  });
}

function attachHandlers(step) {
  const steps = getSteps(activeUnit);
  const prev = document.getElementById("btn-prev");
  const next = document.getElementById("btn-next");
  const submit = document.getElementById("btn-submit");
  if (prev) prev.onclick = () => { if (state.step > 0) { state.step--; render(); } };
  if (next) next.onclick = () => {
    if (state.step >= steps.length - 1) return;
    if (!isStepComplete(steps[state.step])) {
      alert("Lengkapi dulu semua isian pada aspek ini sebelum lanjut ke aspek berikutnya.");
      return;
    }
    state.step++; render();
  };
  if (submit) submit.onclick = onSubmit;

  document.querySelectorAll("[data-step]").forEach((li) => {
    li.onclick = () => {
      const targetIdx = steps.indexOf(li.getAttribute("data-step"));
      if (targetIdx > maxReachableStepIndex()) {
        alert("Selesaikan dulu aspek yang sedang terbuka sebelum melompat ke aspek berikutnya.");
        return;
      }
      state.step = targetIdx; render();
    };
  });

  document.querySelectorAll("[data-unit]").forEach((btn) => {
    btn.onclick = () => switchUnit(btn.getAttribute("data-unit"));
  });

  if (step === "info" || step === "data_up" || step === "data_uk") {
    document.querySelectorAll("[data-info]").forEach((el) => {
      el.oninput = (e) => { state.info[el.getAttribute("data-info")] = e.target.value; saveDraft(); };
    });
  } else if (step !== "review") {
    const currentForm = ASKI_FORMS.find((f) => f.id === step);
    if (currentForm) {
      getConditionBoxes(currentForm).forEach((box) => {
        if (box.hasCheckbox === false) return;
        const condEl = document.getElementById(`cond-${currentForm.id}-${box.id}`);
        if (!condEl) return;
        condEl.onchange = (e) => {
          const checked = e.target.checked;
          state.answers[box.id] = checked;
          if (checked && box.affectsGroups) {
            currentForm.groups.forEach((g) => {
              if (box.affectsGroups.includes(g.title)) {
                g.questions.forEach((q) => {
                  if (q.type === "yn") {
                    state.answers[q.id] = "tidak";
                    clearLockedSubAnswers(currentForm, q.id, "tidak");
                  }
                });
              }
            });
          }
          saveDraft();
          render(true);
        };
      });
    }
    document.querySelectorAll("[data-qid]").forEach((el) => {
      const qid = el.getAttribute("data-qid");
      el.onchange = (e) => {
        state.answers[qid] = e.target.value;

        // Pertanyaan Ya/Tidak dirender sebagai radio dan berfungsi sebagai
        // "induk" bagi sub-poin di bawahnya (lihat clearLockedSubAnswers &
        // renderGroupQuestions). Render ulang di sini supaya perilaku
        // kondisionalnya (kunci/reset sub-poin, highlight pilihan) langsung
        // terlihat, persis seperti updateBlockState() pada form evaluasi
        // naskah dinas — bukan baru tampak setelah pindah langkah.
        if (el.type === "radio") {
          // Skor manual hanya relevan untuk jawaban "Ya" — bersihkan nilai
          // manual lama ketika jawabannya diubah ke "Tidak" supaya tidak
          // tersisa data usang di draft.
          if (e.target.value !== "ya") delete state.answers[qid + "_skor"];
          clearLockedSubAnswers(currentForm, qid, e.target.value);
          saveDraft();
          render(true); // keepScroll: pertahankan posisi scroll pengguna
          return;
        }

        saveDraft();
        // refresh progress circle without full rerender
        const pct = totalProgress().pct;
        const fill = document.querySelector(".progress-circle-fill");
        const label = document.querySelector(".progress-circle-label");
        if (fill) fill.style.strokeDashoffset = (251.3 - (251.3 * pct) / 100).toFixed(1);
        if (label) label.textContent = `${pct}%`;
      };
    });
    document.querySelectorAll("[data-skor-qid]").forEach((el) => {
      el.onchange = (e) => {
        const qid = el.getAttribute("data-skor-qid");
        const std = Number(el.getAttribute("max")) || 100;
        let n = Number(e.target.value);
        if (isNaN(n)) n = std;
        n = Math.max(0, Math.min(std, n));
        state.answers[qid + "_skor"] = n;
        saveDraft();
        render(true); // total skor formulir langsung ter-update
      };
    });
    document.querySelectorAll("[data-na-qid]").forEach((el) => {
      el.onchange = (e) => {
        const qid = el.getAttribute("data-na-qid");
        state.answers[qid + "_na"] = e.target.checked;
        saveDraft();
        render(true); // Nilai Standar & Skor butir ini langsung ter-update jadi 0
      };
    });
    document.querySelectorAll("[data-checklist-qid]").forEach((el) => {
      el.onchange = (e) => {
        const qid = el.getAttribute("data-checklist-qid");
        const opt = el.getAttribute("data-checklist-opt");
        let arr = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
        if (e.target.checked) { if (!arr.includes(opt)) arr.push(opt); }
        else { arr = arr.filter((o) => o !== opt); }
        state.answers[qid] = arr;
        saveDraft();
        el.closest(".check-pill").classList.toggle("sel", e.target.checked);
      };
    });
  }
}

function renderQuestionForm(form) {
  const badge = form.unit === "UP" ? "badge-up" : "badge-uk";
  const boxes = getConditionBoxes(form);
  // Kotak yang bertanda centang DAN benar-benar mempengaruhi grup (affectsGroups)
  // menentukan apakah suatu grup pertanyaan dikunci ke "Tidak/Belum".
  const activeLockingBoxes = boxes.filter(
    (b) => b.hasCheckbox !== false && !!state.answers[b.id] && Array.isArray(b.affectsGroups)
  );
  return `
    <div class="form-header">
      <span class="badge ${badge}">${form.unit === "UP" ? "Unit Pengolah" : "Unit Kearsipan"}</span>
      <h1>${form.code} — ${form.title}</h1>
      <p class="lead">Poin maksimal formulir ini: ${form.maxPoin}${form.maxPoinTambahan ? " (atau " + form.maxPoinTambahan + " jika ada ketentuan tambahan)" : ""}</p>
    </div>
    ${boxes.map((box) => {
      const checked = box.hasCheckbox !== false && !!state.answers[box.id];
      return `
      <div class="card cond-box ${checked ? "checked" : ""}">
        <div class="cond-box-row">
          <div class="cond-box-text">${box.text}</div>
          ${box.hasCheckbox === false ? "" : `<input type="checkbox" class="cond-box-checkbox" id="cond-${form.id}-${box.id}" ${checked ? "checked" : ""} />`}

    ${form.groups.map((g, idx) => {
      const locked = activeLockingBoxes.some((b) => b.affectsGroups.includes(g.title));
      const prevSection = idx > 0 ? form.groups[idx - 1].section : null;
      const sectionHeading = g.section && g.section !== prevSection
        ? `<h2 class="group-section-heading">${g.section}</h2>` : "";
      return `

// Merender seluruh pertanyaan dalam satu grup, sambil melacak pertanyaan
// Ya/Tidak "induk" agar sub-poin (mis. jumlah sampel, checklist rincian)
// yang menyertainya otomatis terkunci ketika induknya dijawab "Tidak".
function renderGroupQuestions(questions, groupLocked) {
  let parentAnswer = null; // jawaban pertanyaan Ya/Tidak terakhir yang dilewati
  let subLockNote = null; // pesan yang ditampilkan pada sub-poin yang ikut terkunci
  const rows = questions.map((q) => {
    if (q.type === "subheading") return renderSubheadingRow(q);
    if (q.type === "yn") {
      const skipLocked = !groupLocked && !!q.skipIfYesId && state.answers[q.skipIfYesId] === "ya";
      parentAnswer = groupLocked || skipLocked ? "tidak" : state.answers[q.id];
      subLockNote = skipLocked
        ? 'Dapat dihilangkan — pernyataan di atas dijawab "Ya"'
        : 'Terkunci — poin di atas dijawab "Tidak"';
      const rowNote = skipLocked ? 'Dapat dihilangkan — pernyataan di atas dijawab "Ya"' : null;
      return renderQuestionRow(q, groupLocked || skipLocked, false, rowNote, skipLocked);
    }
    // pertanyaan non Ya/Tidak dianggap sub-poin dari pertanyaan Ya/Tidak terakhir
    const subLocked = parentAnswer === "tidak";
    return renderQuestionRow(q, groupLocked || subLocked, subLocked && !groupLocked, subLocked && !groupLocked ? subLockNote : null);
  });
  return rows.join("");
}

function renderSubheadingRow(q) {
  return `<tr class="q-subheading-row"><td colspan="2"><div class="q-subheading">${q.label}</div></td></tr>`;
}

function renderQuestionRow(q, locked, isSubLock, lockNote, isSkipLock) {
  const val = locked && q.type === "yn" ? (isSkipLock ? state.answers[q.id] : "tidak") : state.answers[q.id];
  const rowClass = locked ? ' class="q-locked"' : "";
  const noteHtml = lockNote ? `<div class="q-sublock-note">${lockNote}</div>` : (isSubLock ? '<div class="q-sublock-note">Terkunci — poin di atas dijawab "Tidak"</div>' : "");
  if (q.type === "yn") {
    const isNA = !!(q.canBeNA && state.answers[q.id + "_na"]);
    const isLinked = !!(q.linkFormId || q.linkQid);
    const std = getNilaiStandar(q);
    const skor = getSkor(q);
    const skorClass = skor === null ? "" : skor > 0 ? "qs-skor-ya" : "qs-skor-tidak";
    // Selain terkunci (locked) atau di-NA-kan manual, butir juga otomatis
    // dinonaktifkan ketika Nilai Standar-nya 0 karena kondisi lain (mis.
    // ZEROIF/ONLYIF — poin ini tidak berlaku pada kondisi checkbox saat ini).
    const inputsDisabled = locked || isNA || !std;
    const skorDisplay = skor === null ? "–" : Math.round(skor * 100) / 100;

    // Butir auto-link (LINKQ/LINKFORM): tidak dijawab manual di formulir ini
    // — Jawaban & Skor mengikuti (mirror) formulir/pertanyaan sumbernya, dan
    // tampil sebagai indikator baca-saja. Checkbox "Tidak menjadi pembagi"
    // tetap tersedia jika butir ini punya alasan NA sendiri (mis. Unit
    // Pengolah tidak memiliki Arsiparis).
    if (isLinked) {
      const linkedVal = q.linkQid ? state.answers[q.linkQid] : null;
      const linkedValHtml = q.linkQid
        ? (linkedVal === "ya"
            ? '<span class="radio-pill sel-ya" style="cursor:default;">Ya</span>'
            : linkedVal === "tidak"
              ? '<span class="radio-pill sel-tidak" style="cursor:default;">Tidak</span>'
              : '<span class="q-sublock-note">Belum dijawab pada formulir sumber</span>')
        : "";
      const sourceForm = q.linkFormId ? ASKI_FORMS.find((f) => f.id === q.linkFormId) : null;
      const linkNote = q.linkFormId
        ? `Skor otomatis mengikuti persentase skor formulir ${sourceForm ? sourceForm.code + " — " + sourceForm.title : q.linkFormId}.`
        : `Jawaban & Skor otomatis mengikuti butir ${q.linkQid} pada formulir Pemeliharaan Arsip.`;
      return `
      <tr${rowClass}>
        <td class="q-label">${q.label}${q.note ? `<div class="q-note">${q.note}</div>` : ""}${noteHtml}</td>
        <td class="q-input">
          ${linkedValHtml}
          <div class="qs-meta">
            <span class="qs-badge qs-std">Nilai Standar <b>${std}</b></span>
            <span class="qs-badge ${skorClass}">Skor <b>${isNA ? 0 : skorDisplay}</b></span>
          </div>
          <div class="q-sublock-note" style="margin-top:0.35rem;">${linkNote}</div>
          ${q.canBeNA ? `
          <label class="na-toggle">
            <input type="checkbox" data-na-qid="${q.id}" ${isNA ? "checked" : ""} ${locked ? "disabled" : ""}/>
            Tidak menjadi pembagi (Nilai Standar dinolkan)
          </label>` : ""}
        </td>
      </tr>`;
    }

    // Skor dapat diisi manual HANYA ketika jawabannya "Ya" (dan tidak
    // terkunci/di-NA-kan) — mis. untuk penilaian sebagian/parsial. Ketika
    // jawabannya "Tidak", Skor tetap otomatis 0 dan tidak bisa diubah.
    const skorEditable = val === "ya" && !inputsDisabled;
    const skorHtml = skorEditable
      ? `Skor <input type="number" class="skor-manual-input" data-skor-qid="${q.id}" min="0" max="${std}" step="1" value="${skor}" />`
      : `Skor <b>${skor === null ? "–" : skor}</b>`;
    return `
      <tr${rowClass}>
        <td class="q-label">${q.label}${q.note ? `<div class="q-note">${q.note}</div>` : ""}${noteHtml}</td>
        <td class="q-input">
          <label class="radio-pill ${val === "ya" ? "sel-ya" : ""}">
            <input type="radio" name="${q.id}" data-qid="${q.id}" value="ya" ${val === "ya" ? "checked" : ""} ${inputsDisabled ? "disabled" : ""}/> Ya
          </label>
          <label class="radio-pill ${val === "tidak" ? "sel-tidak" : ""}">
            <input type="radio" name="${q.id}" data-qid="${q.id}" value="tidak" ${val === "tidak" ? "checked" : ""} ${inputsDisabled ? "disabled" : ""}/> Tidak
          </label>
          <div class="qs-meta">
            <span class="qs-badge qs-std">Nilai Standar <b>${std}</b></span>
            <span class="qs-badge ${skorClass}">${skorHtml}</span>
          </div>
          ${q.canBeNA ? `
          <label class="na-toggle">
            <input type="checkbox" data-na-qid="${q.id}" ${isNA ? "checked" : ""} ${locked ? "disabled" : ""}/>
            Tidak menjadi pembagi (Nilai Standar dinolkan)
          </label>` : ""}
        </td>
      </tr>`;
  } else if (q.type === "choice") {
    const std = getNilaiStandar(q);
    const skor = getSkor(q);
    const skorClass = skor === null ? "" : skor > 0 ? "qs-skor-ya" : "qs-skor-tidak";
    const choiceDisabled = locked || !std;
    return `
      <tr${rowClass}>
        <td class="q-label">${q.label}${q.note ? `<div class="q-note">${q.note}</div>` : ""}${noteHtml}</td>
        <td class="q-input">
          ${(q.options || []).map((o) => `
          <label class="radio-pill ${val === o.value ? "sel-ya" : ""}">
            <input type="radio" name="${q.id}" data-qid="${q.id}" data-choice="1" value="${o.value}" ${val === o.value ? "checked" : ""} ${choiceDisabled ? "disabled" : ""}/> ${o.label}
          </label>`).join("")}
          <div class="qs-meta">
            <span class="qs-badge qs-std">Nilai Standar <b>${std}</b></span>
            <span class="qs-badge ${skorClass}">Skor <b>${skor === null ? "–" : skor}</b></span>
          </div>
        </td>
      </tr>`;
  } else if (q.type === "percent") {
    return `
      <tr${rowClass}>
        <td class="q-label">${q.label}${q.note ? `<div class="q-note">${q.note}</div>` : ""}${noteHtml}</td>
        <td class="q-input">
          <input type="number" min="0" max="100" placeholder="0-100" class="percent-input"
            data-qid="${q.id}" value="${val !== undefined ? val : ""}" ${locked ? "disabled" : ""} /> %
        </td>
      </tr>`;
  } else if (q.type === "number") {
    return `
      <tr${rowClass}>
        <td class="q-label">${q.label}${q.note ? `<div class="q-note">${q.note}</div>` : ""}${noteHtml}</td>
        <td class="q-input">
          <input type="number" min="0" ${q.max ? `max="${q.max}"` : ""} step="1" placeholder="0" class="percent-input"
            data-qid="${q.id}" value="${val !== undefined ? val : ""}" ${locked ? "disabled" : ""} /> ${q.unit ? q.unit : ""}
        </td>
      </tr>`;
  } else if (q.type === "checklist") {
    const arr = Array.isArray(val) ? val : [];
    return `
      <tr${rowClass}>
        <td class="q-label" colspan="2">
          <div class="q-checklabel">${q.label}</div>
          ${q.note ? `<div class="q-note q-subnote">${q.note}</div>` : ""}
          ${noteHtml}
          <div class="checklist-group" style="margin-top:0.5rem;">
            ${q.options.map((opt) => `
              <label class="check-pill ${arr.includes(opt) ? "sel" : ""}">
                <input type="checkbox" data-checklist-qid="${q.id}" data-checklist-opt="${opt.replace(/"/g, "&quot;")}" ${arr.includes(opt) ? "checked" : ""} ${locked ? "disabled" : ""}/> ${opt}
              </label>
            `).join("")}
          </div>
        </td>
      </tr>`;
  }
  return "";
}

/* ---------------- RENDER: REVIEW ---------------- */
function renderReview() {
  const prog = totalProgress();
  const isUP = activeUnit === "UP";
  const missing = ASKI_FORMS.filter((f) => f.unit === activeUnit).map((f) => {
    const total = f.groups.reduce((s, g) => s + g.questions.filter((q) => q.type !== "info" && q.type !== "checklist" && q.type !== "number" && q.type !== "subheading" && !isSkipped(q)).length, 0);
    let answered = 0;
    f.groups.forEach((g) => g.questions.forEach((q) => {
      if (q.type === "info" || q.type === "checklist" || q.type === "number" || q.type === "subheading" || isSkipped(q)) return;
      const v = state.answers[q.id];
      if (v !== undefined && v !== "") answered++;
    }));
    return { form: f, total, answered };
  }).filter((x) => x.answered < x.total);

  return `
    <h1>Tinjau Sebelum Mengirim — ${isUP ? "Unit Pengolah" : "Unit Kearsipan"}</h1>
    <p class="lead">Progres ${isUP ? "Unit Pengolah" : "Unit Kearsipan"}: <strong>${prog.answered} / ${prog.total}</strong> pertanyaan (${prog.pct}%).</p>
    <div class="card">
      <h3>Data Instansi</h3>
      <table class="review-table">
        <tr><td>Nama Instansi</td><td>${state.info.namaInstansi || "-"}</td></tr>
        <tr><td>${isUP ? "Unit Pengolah" : "Unit Kearsipan"}</td><td>${(isUP ? state.info.unitPengolah : state.info.unitKearsipan) || "-"}</td></tr>
        <tr><td>Alamat</td><td>${state.info.alamat || "-"}</td></tr>
        <tr><td>Tanggal Audit</td><td>${state.info.tanggalAudit || "-"}</td></tr>
      </table>
    </div>
    ${missing.length ? `
      <div class="card warning-card">
        <h3>⚠ Formulir Belum Lengkap</h3>
        <p>Pertanyaan yang belum diisi akan otomatis dinilai <strong>0 (Tidak)</strong> dalam perhitungan. Klik untuk melengkapi:</p>
        <ul class="missing-list">
          ${missing.map((m) => `<li data-step="${m.form.id}">${m.form.code} — ${m.form.title} (${m.answered}/${m.total} terisi)</li>`).join("")}
        </ul>
      </div>
    ` : `<div class="card success-card"><h3>✓ Seluruh pertanyaan telah terisi</h3></div>`}
    <p class="lead">Setelah dikirim, sistem akan menghitung nilai dan kategori ${isUP ? "Unit Pengolah" : "Unit Kearsipan"} ini sesuai standar penilaian ASKI PEMDA, lalu menyimpannya secara terpisah dari unit lainnya.</p>
  `;
}

/* ---------------- SUBMIT ---------------- */
async function onSubmit() {
  const result = computeScores();
  const u = activeUnit.toLowerCase();
  state.result = result;
  state.submitted = true;
  saveDraft();

  // Simpan ke Supabase jika telah dikonfigurasi. Setiap unit mengirim
  // baris hasilnya sendiri-sendiri (ditandai kolom "unit"), sehingga
  // pengiriman Unit Pengolah dan Unit Kearsipan tidak saling menimpa.
  if (typeof supabaseClient !== "undefined" && supabaseClient) {
    try {
      const { data, error } = await supabaseClient.from(SUPABASE_TABLE).insert([{
        unit: activeUnit,
        dinas_id: currentProfile ? currentProfile.dinas_id : null,
        nama_instansi: state.info.namaInstansi,
        unit_pengolah: activeUnit === "UP" ? state.info.unitPengolah : null,
        unit_kearsipan: activeUnit === "UK" ? state.info.unitKearsipan : null,
        alamat: state.info.alamat,
        tanggal_audit: state.info.tanggalAudit || null,
        tim_pengawas: [state.info.tim1, state.info.tim2, state.info.tim3].filter(Boolean).join(", "),
        up_penanggungjawab_nama: activeUnit === "UP" ? state.info.upNama : null,
        up_penanggungjawab_jabatan: activeUnit === "UP" ? state.info.upJabatan : null,
        uk_penanggungjawab_nama: activeUnit === "UK" ? state.info.ukNama : null,
        uk_penanggungjawab_jabatan: activeUnit === "UK" ? state.info.ukJabatan : null,
        answers: state.answers,
        scores: result,
        nilai_akhir: result[u].overall,
        kategori: result[u].kategori.kode,
        status: "submitted",
      }]).select();
      if (error) throw error;
      if (data && data[0]) state.recordId = data[0].id;
    } catch (e) {
      console.error("Gagal menyimpan ke Supabase:", e);
      alert("Catatan: hasil audit berhasil dihitung, namun gagal disimpan ke database Supabase (" + (e.message || e) + "). Pastikan konfigurasi js/config.js sudah benar.");
    }
  }
  saveDraft();
  renderResult();
}

// Merender tabel "Rekapitulasi Nilai Audit Sistem Kearsipan Internal"
// persis format instrumen ASKI PEMDA resmi (kolom: Nilai Standar, Nilai,
// Bobot Sub-Aspek, Nilai Sub-Aspek, Bobot Aspek, Nilai Aspek), dipakai untuk
// Unit Pengolah maupun Unit Kearsipan. Bobot Sub-Aspek dibagi rata sesuai
// jumlah sub aspek dalam tiap aspek (Pengelolaan Arsip Dinamis & Sumber Daya
// Kearsipan), dan Bobot Aspek tetap 50% : 50% sesuai standar penilaian ASKI.
function renderOfficialRecap(unit, r) {
  const forms = ASKI_FORMS.filter((f) => f.unit === unit);
  const aspectDefs = [
    { key: "dinamis", label: "PENGELOLAAN ARSIP DINAMIS" },
    { key: "sdk", label: "SUMBER DAYA KEARSIPAN" },
  ];
  const u = unit.toLowerCase();
  const unitLabel = unit === "UP" ? "UNIT PENGOLAH" : "UNIT KEARSIPAN";
  const unitName = unit === "UP" ? (state.info.unitPengolah || "-") : (state.info.unitKearsipan || "-");
  const fmt = (n) => Math.round(n).toLocaleString("id-ID");

  let bodyRows = "";
  aspectDefs.forEach((asp, i) => {
    const subForms = forms.filter((f) => f.aspect === asp.key);
    if (!subForms.length) return;
    const bobotSubFrac = 1 / subForms.length;
    const subRows = subForms.map((f) => {
      const fs = r.forms[f.id];
      const nilaiSub = fs.stdTotal ? (fs.sum / fs.stdTotal) * bobotSubFrac * 100 : 0;
      return { f, std: fs.stdTotal, nilai: fs.sum, nilaiSub };
    });
    const aspectStd = subRows.reduce((s, x) => s + x.std, 0);
    const aspectNilai = subRows.reduce((s, x) => s + x.nilai, 0);
    const aspectNilaiSub = subRows.reduce((s, x) => s + x.nilaiSub, 0);
    const aspectNilaiAspek = aspectNilaiSub * 0.5;
    const rowspan = subRows.length + 1;

    bodyRows += `
      <tr class="aspect-row">
        <td class="col-no">${i + 1}</td>
        <td class="col-label">${asp.label}</td>
        <td class="num">${fmt(aspectStd)}</td>
        <td class="num">${fmt(aspectNilai)}</td>
        <td class="pct"></td>
        <td class="num">${aspectNilaiSub.toFixed(2)}</td>
        <td class="pct" rowspan="${rowspan}">50%</td>
        <td class="num" rowspan="${rowspan}">${aspectNilaiAspek.toFixed(2)}</td>
      </tr>`;
    subRows.forEach((x) => {
      const subCode = x.f.code.split(".").slice(1).join(".");
      bodyRows += `
      <tr class="sub-row">
        <td class="col-no"></td>
        <td class="col-label">${subCode} ${x.f.title}</td>
        <td class="num">${fmt(x.std)}</td>
        <td class="num">${fmt(x.nilai)}</td>
        <td class="pct">${Math.round(bobotSubFrac * 100)}%</td>
        <td class="num">${x.nilaiSub.toFixed(2)}</td>
      </tr>`;
    });
  });

  return `
    <div class="official-recap-wrap">
      <p class="official-recap-title">Rekapitulasi Nilai Audit Sistem Kearsipan Internal</p>
      <p class="official-recap-title sub">${unitLabel}</p>
      <p class="official-recap-title unit-name">: ${unitName}</p>
      <table class="official-recap unit-${u}">
        <thead>
          <tr>
            <th>No</th><th>Aspek/Sub Aspek</th><th>Nilai Standar</th><th>Nilai</th>
            <th>Bobot Sub-Aspek</th><th>Nilai Sub-Aspek</th><th>Bobot Aspek</th><th>Nilai Aspek</th>
          </tr>
          <tr class="num-row">
            <th>(1)</th><th>(2)</th><th>(3)</th><th>(4)</th><th>(5)</th>
            <th>(6) = (4) / (3) x (5) x 100</th><th>(7)</th><th>(8) = (6) x (7)</th>
          </tr>
        </thead>
        <tbody>
          ${bodyRows}
          <tr class="total-row">
            <td colspan="7">Nilai Hasil Pengawasan Kearsipan</td>
            <td class="num">${r[u].overall.toFixed(2)}</td>
          </tr>
          <tr class="kategori-row">
            <td colspan="7">Kategori</td>
            <td>${r[u].kategori.kode} (${r[u].kategori.label.toUpperCase()})</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   EKSPOR — Excel (.xlsx) & PDF terstruktur
   Membangun ulang baris rekapitulasi (sama seperti renderOfficialRecap)
   dalam bentuk data mentah, dipakai untuk ekspor Excel dan PDF.
   ============================================================ */
function buildRecapRows(unit, r) {
  const forms = ASKI_FORMS.filter((f) => f.unit === unit);
  const aspectDefs = [
    { key: "dinamis", label: "PENGELOLAAN ARSIP DINAMIS" },
    { key: "sdk", label: "SUMBER DAYA KEARSIPAN" },
  ];
  const u = unit.toLowerCase();
  const rows = [];
  aspectDefs.forEach((asp, i) => {
    const subForms = forms.filter((f) => f.aspect === asp.key);
    if (!subForms.length) return;
    const bobotSubFrac = 1 / subForms.length;
    const subRows = subForms.map((f) => {
      const fs = r.forms[f.id];
      const nilaiSub = fs.stdTotal ? (fs.sum / fs.stdTotal) * bobotSubFrac * 100 : 0;
      return { f, std: fs.stdTotal, nilai: fs.sum, nilaiSub };
    });
    const aspectStd = subRows.reduce((s, x) => s + x.std, 0);
    const aspectNilai = subRows.reduce((s, x) => s + x.nilai, 0);
    const aspectNilaiSub = subRows.reduce((s, x) => s + x.nilaiSub, 0);
    const aspectNilaiAspek = aspectNilaiSub * 0.5;

    rows.push({
      no: i + 1, label: asp.label, isAspect: true,
      nilaiStandar: aspectStd, nilai: aspectNilai, bobotSub: "",
      nilaiSub: aspectNilaiSub, bobotAspek: "50%", nilaiAspek: aspectNilaiAspek,
    });
    subRows.forEach((x) => {
      const subCode = x.f.code.split(".").slice(1).join(".");
      rows.push({
        no: "", label: `${subCode} ${x.f.title}`, isAspect: false,
        nilaiStandar: x.std, nilai: x.nilai,
        bobotSub: Math.round(bobotSubFrac * 100) + "%",
        nilaiSub: x.nilaiSub, bobotAspek: "", nilaiAspek: "",
      });
    });
  });
  rows.push({ no: "", label: "Nilai Hasil Pengawasan Kearsipan", isTotal: true, nilaiAspek: r[u].overall });
  rows.push({ no: "", label: "Kategori", isKategori: true, nilaiAspek: `${r[u].kategori.kode} (${r[u].kategori.label.toUpperCase()})` });
  return rows;
}

function buildDetailRows(unit) {
  // Baris detail seluruh butir pertanyaan & jawaban, untuk arsip lengkap
  const forms = ASKI_FORMS.filter((f) => f.unit === unit);
  const rows = [];
  forms.forEach((form) => {
    form.groups.forEach((g) => {
      g.questions.forEach((q) => {
        if (q.type === "info" || q.type === "subheading") return;
        const val = state.answers[q.id];
        let jawaban = "";
        if (q.type === "yn") jawaban = val === "ya" ? "Ya" : val === "tidak" ? "Tidak" : "-";
        else if (q.type === "percent" || q.type === "number") jawaban = (val !== undefined && val !== "") ? val : "-";
        else if (q.type === "choice") jawaban = val !== undefined ? String(val) : "-";
        else if (q.type === "checklist") jawaban = (val && val.length) ? "Ditandai" : "-";
        else jawaban = val !== undefined ? String(val) : "-";
        rows.push({
          form: `${form.code} ${form.title}`,
          butir: q.label || q.id,
          jawaban,
        });
      });
    });
  });
  return rows;
}

function exportRecapExcel() {
  if (typeof XLSX === "undefined") { alert("Pustaka Excel gagal dimuat. Periksa koneksi internet."); return; }
  const r = state.result;
  const unitLabel = activeUnit === "UP" ? "Unit Pengolah" : "Unit Kearsipan";
  const rows = buildRecapRows(activeUnit, r);

  const wsData = [];
  wsData.push(["REKAPITULASI NILAI AUDIT SISTEM KEARSIPAN INTERNAL"]);
  wsData.push([unitLabel.toUpperCase()]);
  wsData.push(["Nama Instansi", state.info.namaInstansi || "-"]);
  wsData.push([unitLabel, (activeUnit === "UP" ? state.info.unitPengolah : state.info.unitKearsipan) || "-"]);
  wsData.push(["Tanggal Audit", state.info.tanggalAudit || "-"]);
  wsData.push(["Tim Pengawas", [state.info.tim1, state.info.tim2, state.info.tim3].filter(Boolean).join(", ") || "-"]);
  wsData.push([]);
  wsData.push(["No", "Aspek/Sub Aspek", "Nilai Standar", "Nilai", "Bobot Sub-Aspek", "Nilai Sub-Aspek", "Bobot Aspek", "Nilai Aspek"]);
  rows.forEach((x) => {
    if (x.isTotal || x.isKategori) {
      wsData.push([x.label, "", "", "", "", "", "", x.nilaiAspek]);
    } else {
      wsData.push([x.no, x.label, x.nilaiStandar, x.nilai, x.bobotSub, Number(x.nilaiSub.toFixed(2)), x.bobotAspek, x.nilaiAspek]);
    }
  });

  const wb = XLSX.utils.book_new();
  const wsRecap = XLSX.utils.aoa_to_sheet(wsData);
  wsRecap["!cols"] = [{ wch: 5 }, { wch: 45 }, { wch: 13 }, { wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, wsRecap, "Rekapitulasi");

  const detail = buildDetailRows(activeUnit);
  const wsDetailData = [["Formulir", "Butir Pertanyaan / Pernyataan", "Jawaban"]];
  detail.forEach((d) => wsDetailData.push([d.form, d.butir, d.jawaban]));
  const wsDetail = XLSX.utils.aoa_to_sheet(wsDetailData);
  wsDetail["!cols"] = [{ wch: 30 }, { wch: 70 }, { wch: 15 }];
  XLSX.utils.book_append_sheet(wb, wsDetail, "Detail Jawaban");

  const fname = `ASKI_${activeUnit}_${(state.info.namaInstansi || "instansi").replace(/[^a-z0-9]+/gi, "_")}_${state.info.tanggalAudit || "hasil"}.xlsx`;
  XLSX.writeFile(wb, fname);
}

function exportRecapPDF() {
  if (typeof window.jspdf === "undefined") { alert("Pustaka PDF gagal dimuat. Periksa koneksi internet."); return; }
  const { jsPDF } = window.jspdf;
  const r = state.result;
  const unitLabel = activeUnit === "UP" ? "Unit Pengolah" : "Unit Kearsipan";
  const rows = buildRecapRows(activeUnit, r);
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

  doc.setFontSize(13);
  doc.text("REKAPITULASI NILAI AUDIT SISTEM KEARSIPAN INTERNAL", 148, 15, { align: "center" });
  doc.setFontSize(11);
  doc.text(unitLabel.toUpperCase(), 148, 21, { align: "center" });
  doc.setFontSize(9);
  doc.text(`Nama Instansi : ${state.info.namaInstansi || "-"}`, 14, 30);
  doc.text(`${unitLabel} : ${(activeUnit === "UP" ? state.info.unitPengolah : state.info.unitKearsipan) || "-"}`, 14, 35);
  doc.text(`Tanggal Audit : ${state.info.tanggalAudit || "-"}`, 200, 30);
  doc.text(`Tim Pengawas : ${[state.info.tim1, state.info.tim2, state.info.tim3].filter(Boolean).join(", ") || "-"}`, 200, 35);

  const body = rows.map((x) => {
    if (x.isTotal || x.isKategori) {
      return [{ content: x.label, colSpan: 7, styles: { fontStyle: "bold" } }, x.nilaiAspek];
    }
    return [
      x.no, x.label,
      x.nilaiStandar !== undefined ? Math.round(x.nilaiStandar) : "",
      x.nilai !== undefined ? Math.round(x.nilai) : "",
      x.bobotSub, x.nilaiSub !== undefined && x.nilaiSub !== "" ? Number(x.nilaiSub).toFixed(2) : "",
      x.bobotAspek, x.nilaiAspek !== undefined && x.nilaiAspek !== "" ? Number(x.nilaiAspek).toFixed(2) : "",
    ];
  });

  doc.autoTable({
    startY: 40,
    head: [["No", "Aspek/Sub Aspek", "Nilai Standar", "Nilai", "Bobot Sub-Aspek", "Nilai Sub-Aspek", "Bobot Aspek", "Nilai Aspek"]],
    body,
    styles: { fontSize: 8, cellPadding: 1.5 },
    headStyles: { fillColor: [204, 0, 0] },
    theme: "grid",
  });

  const finalY = doc.lastAutoTable.finalY || 40;
  doc.setFontSize(9);
  doc.text("Tanda Tangan Penanggung Jawab", 14, finalY + 12);
  doc.text("________________________", 14, finalY + 26);

  const fname = `ASKI_${activeUnit}_${(state.info.namaInstansi || "instansi").replace(/[^a-z0-9]+/gi, "_")}_${state.info.tanggalAudit || "hasil"}.pdf`;
  doc.save(fname);
}

/* ---------------- GERBANG LOGIN ---------------- */
// Formulir hanya boleh diisi oleh akun dinas yang sudah terdaftar (lihat
// register.html & schema_akun_dinas.sql). Sebelum menampilkan formulir,
// aplikasi memeriksa sesi Supabase yang aktif; jika belum ada/valid,
// tampilkan layar login dan tunda render() formulir sampai berhasil masuk.

function renderAuthScreen(bodyHtml) {
  app.innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <img src="${LOGO_URL}" alt="Archive logo" />
          <div>
            <div class="auth-brand-title">AUDIT SISTEM KEARSIPAN INTERNAL</div>
            <div class="auth-brand-sub">Pemerintah Daerah Kabupaten Malaka</div>
          </div>
        </div>
        ${bodyHtml}
      </div>
    </div>
  `;
}

function renderLoginGate(errorMsg, infoMsg) {
  renderAuthScreen(`
    <h1>Masuk ke Formulir ASKI</h1>
    <p class="auth-lead">Gunakan akun dinas yang telah terdaftar untuk mengisi formulir audit.</p>
    <form id="loginGateForm">
      <div class="auth-field">
        <label>Email</label>
        <input id="loginGateEmail" type="email" autocomplete="username" required />
      </div>
      <div class="auth-field">
        <label>Kata Sandi</label>
        <input id="loginGatePass" type="password" autocomplete="current-password" required />
      </div>
      <button class="auth-submit" type="submit" id="loginGateBtn">Masuk</button>
      <div class="auth-msg ${errorMsg ? "err" : infoMsg ? "ok" : ""}" id="loginGateMsg">${errorMsg || infoMsg || ""}</div>
    </form>
    <div class="auth-foot">Belum punya akun? Hubungi admin untuk kode undangan, lalu <a href="register.html">REGISTRASI</a>.</div>
    <div class="auth-foot">Login <a href="https://kabasmean.github.io/ASKI/admin.html">ADMINISTRATOR</a></div>
  `);
  if (!supabaseClient) {
    document.getElementById("loginGateMsg").innerHTML =
      '<span class="err">Supabase belum dikonfigurasi. Hubungi admin aplikasi.</span>';
    document.getElementById("loginGateMsg").className = "auth-msg err";
    document.getElementById("loginGateBtn").disabled = true;
    return;
  }
  document.getElementById("loginGateForm").addEventListener("submit", handleLoginGateSubmit);
}

async function handleLoginGateSubmit(e) {
  e.preventDefault();
  const email = document.getElementById("loginGateEmail").value.trim();
  const password = document.getElementById("loginGatePass").value;
  const msg = document.getElementById("loginGateMsg");
  const btn = document.getElementById("loginGateBtn");
  msg.textContent = ""; msg.className = "auth-msg";
  btn.disabled = true; btn.textContent = "Memeriksa…";

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    btn.disabled = false; btn.textContent = "Masuk";
    msg.className = "auth-msg err";
    msg.textContent = error.message || "Email atau kata sandi salah.";
    return;
  }
  const ok = await loadProfileAndEnter(data.session);
  if (!ok) { btn.disabled = false; btn.textContent = "Masuk"; }
}

// Setelah login sukses, ambil profil dinas milik akun ini. Jika akun belum
// terhubung ke dinas manapun (mis. belum menyelesaikan pendaftaran dengan
// kode undangan), tolak akses ke formulir dan keluarkan kembali.
async function loadProfileAndEnter(session) {
  const { data: profile, error } = await supabaseClient
    .from("profiles").select("*, dinas:dinas_id(nama)").eq("id", session.user.id).single();
  if (error || !profile || !profile.dinas_id) {
    await supabaseClient.auth.signOut();
    renderLoginGate("Akun ini belum terhubung ke dinas manapun. Selesaikan pendaftaran lewat register.html atau hubungi admin.");
    return false;
  }
  currentSession = session;
  currentProfile = profile;
  loadDraft();
  render();
  return true;
}

async function doAuthLogout() {
  if (!confirm("Keluar dari formulir ASKI?")) return;
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentSession = null;
  currentProfile = null;
  renderLoginGate();
}

async function initAuthGate() {
  if (!supabaseClient) { renderLoginGate(); return; }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const ok = await loadProfileAndEnter(session);
    if (ok) return;
  } else {
    renderLoginGate();
  }
}

/* ---------------- INIT ---------------- */
initAuthGate();

</script>
